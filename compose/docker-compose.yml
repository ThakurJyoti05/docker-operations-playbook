version: "3.9"

services:

  python-app:
    image: python-app
    container_name: python-app
    ports:
      - "5000:5000"

  mysql-db:
    image: mysql
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis
    container_name: redis

volumes:
  mysql-data:
